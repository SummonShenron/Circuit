[project]
name = "workflow-builder-api"
version = "0.1.0"
description = "API for a visual agentic workflow builder"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.6.0",
    "motor>=3.6.0",
    "langgraph>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "httpx>=0.28.0",
    "google-auth-oauthlib>=1.2.0",
    "cryptography>=43.0.0",
    "PyJWT[crypto]>=2.10.0",
    "tzdata>=2024.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"