<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- Dark canvas background -->
  <rect width="32" height="32" rx="7" fill="#0F1E17" />

  <!-- Circuit nodes & step connector -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-Left Node -->
    <rect x="7.5" y="7.5" width="7" height="7" rx="2" />

    <!-- Bottom-Right Node -->
    <rect x="17.5" y="17.5" width="7" height="7" rx="2" />

    <!-- 90-Degree Orthogonal Circuit Connector -->
    <path d="M 11 14.5 V 18 Q 11 21 14 21 H 17.5" />
  </g>
</svg>
